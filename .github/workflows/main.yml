---
name: Make

on:
  schedule:
    - cron: '0 0 1 * *'
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Lint and host compile
        shell: bash
        run: bash .github/workflows/main.sh lint

  smoke:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # MINGW64, not CLANG64. ewpi looks up the mingw host triplet
      # (x86_64-w64-mingw32-gcc) and, on Windows, copies gcc.exe to that name.
      - name: Setup MSYS2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: mingw64
          update: true
          install: >-
            base-devel
            autoconf
            automake
            libtool
            tar
            git
            wget
            python
            perl
            flex
            bison
            gettext-devel
            pkgconf
            make
            mingw-w64-x86_64-gettext-tools
            mingw-w64-x86_64-gperf
            mingw-w64-x86_64-nasm
            yasm
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-meson
            mingw-w64-x86_64-nsis
            mingw-w64-x86_64-itstool

      - name: Build zlib
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: bash .github/workflows/main.sh smoke

      - name: Build zlib
        if: runner.os != 'Windows'
        shell: bash
        run: bash .github/workflows/main.sh smoke
